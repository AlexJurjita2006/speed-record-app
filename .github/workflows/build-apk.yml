name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build React app
        run: |
          cd frontend
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nitron dependencies
        run: |
          cd speed-record-mobile
          npm install

      - name: Build Android APK
        run: |
          cd speed-record-mobile
          npm run build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedRecord-APK
          path: speed-record-mobile/dist/*.apk