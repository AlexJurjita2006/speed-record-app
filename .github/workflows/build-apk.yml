name: Build Android APK with Capacitor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build React app
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SpeedRecord-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Speed Record v${{ github.run_number }}
          body: |
            🏁 **Speed Record** – build automat generat din commit ${{ github.sha }}.
            
            📱 **Descarcă APK-ul** de mai jos și instalează-l pe telefon.
            
            🔗 Link permanent către acest release: ${{ github.event.repository.html_url }}/releases/tag/v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: SpeedRecord.apk
          asset_content_type: application/vnd.android.package-archive